name: Feature request
description: Propose an improvement to the community TUI, Linux AppImage, E2EE remote control plane, or tooling without vendoring upstream core.
title: "[Feat] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        `dsh-community` follows the **Complementary Edition** boundary (`Official Source Ownership = 0`).
        Requests for the core Agent loop, model behavior, Official Web, or Win/macOS Desktop belong in upstream `deepseek-ai/deepseek-harness`.
  - type: dropdown
    id: surface
    attributes:
      label: Target surface
      options:
        - WSL/Linux Terminal / TUI
        - Linux AppImage Shell
        - Remote Control Plane (Host / Gateway / Web PWA)
        - Android Remote Client ([LABS] / [UNVERIFIED])
        - Marketplace / Compatibility Tooling
        - Documentation / Handbook
        - Release / Security / CI
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution and architectural boundary
      description: How can this work cleanly using official seams without vendoring `@deepseek-ai/dsh` or creating a second session store?
    validations:
      required: true
