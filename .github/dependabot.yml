version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Routine maintenance stays reviewable. Major framework/runtime upgrades
    # are intentional engineering projects, not unattended maintenance.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # esbuild is pre-1.0; a 0.x minor jump may carry breaking changes.
      # Keep routine automation to patch updates within the reviewed minor line.
      - dependency-name: "esbuild"
        update-types:
          - version-update:semver-minor
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Release/signing workflows are production infrastructure. Do not jump
    # action majors without an explicit compatibility review.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
