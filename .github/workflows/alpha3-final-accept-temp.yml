name: alpha3-final-accept-temp

on:
  push:
    branches:
      - 'upgrade/dsh-0.1.2-alpha.3'
    paths:
      - '.alpha3-final-accept-trigger'

permissions:
  contents: read

concurrency:
  group: alpha3-final-accept-temp
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Run consolidated alpha.3 acceptance
        run: node scripts/accept-alpha3-integration.mjs
