name: alpha4-lock-contract-gen-temp

on:
  push:
    branches:
      - 'upgrade/dsh-0.1.2-alpha.4'
    paths:
      - '.alpha4-lock-contract-gen-trigger'

permissions:
  contents: write

concurrency:
  group: alpha4-lock-contract-gen-temp
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Verify exact root package
        run: |
          set -euo pipefail
          test "$(npm view @deepseek-ai/dsh@0.1.2-alpha.4 version)" = "0.1.2-alpha.4"

      - name: Generate frozen workspace lock
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Generate initial Desktop runtime lock
        working-directory: apps/desktop/runtime-lock
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Freeze complete DSH runtime family from actual alpha.4 closure
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const target = '0.1.2-alpha.4'
          const pkgPath = 'apps/desktop/runtime-lock/package.json'
          const lockPath = 'apps/desktop/runtime-lock/package-lock.json'
          const pkg = JSON.parse(readFileSync(pkgPath, 'utf8'))
          const lock = JSON.parse(readFileSync(lockPath, 'utf8'))

          const packageNameFromLockPath = (path) => {
            const marker = 'node_modules/'
            const i = path.lastIndexOf(marker)
            return i === -1 ? null : path.slice(i + marker.length)
          }

          const family = [...new Set(
            Object.keys(lock.packages ?? {})
              .map(packageNameFromLockPath)
              .filter((name) =>
                typeof name === 'string'
                && (name === '@deepseek-ai/dsh' || name.startsWith('@deepseek-ai/dsh-'))
              ),
          )].sort()

          if (!family.includes('@deepseek-ai/dsh')) {
            throw new Error('initial runtime lock omitted @deepseek-ai/dsh')
          }

          const children = family.filter((name) => name !== '@deepseek-ai/dsh')
          const topLevel = Object.keys(lock.packages ?? {})
            .filter((path) => /^node_modules\/@deepseek-ai\/dsh[^/]*$/u.test(path))
            .map(packageNameFromLockPath)
            .filter((name) => name !== null && name !== '@deepseek-ai/dsh')
            .sort()

          pkg.dependencies['@deepseek-ai/dsh'] = target
          pkg.overrides = {
            '@deepseek-ai/dsh': {
              '.': target,
              ...Object.fromEntries(children.map((name) => [name, target])),
            },
            ...Object.fromEntries(topLevel.map((name) => [name, target])),
          }

          writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n')
          console.log('frozen DSH family names:', family.length)
          console.log('top-level peer/root overrides:', topLevel.length)
          NODE

      - name: Regenerate exact Desktop runtime lock
        working-directory: apps/desktop/runtime-lock
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify exact runtime family and reconcile lifecycle versions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const target = '0.1.2-alpha.4'
          const lockPath = 'apps/desktop/runtime-lock/package-lock.json'
          const policyPath = 'apps/desktop/runtime-lock/lifecycle-scripts.json'
          const lock = JSON.parse(readFileSync(lockPath, 'utf8'))
          const policy = JSON.parse(readFileSync(policyPath, 'utf8'))

          const packageNameFromLockPath = (path) => {
            const marker = 'node_modules/'
            const i = path.lastIndexOf(marker)
            return i === -1 ? null : path.slice(i + marker.length)
          }

          const dshRows = Object.entries(lock.packages ?? {})
            .filter(([path]) => {
              const name = packageNameFromLockPath(path)
              return name === '@deepseek-ai/dsh' || name?.startsWith('@deepseek-ai/dsh-')
            })
            .map(([path, entry]) => ({
              path,
              name: packageNameFromLockPath(path),
              version: entry?.version,
            }))

          const wrong = dshRows.filter((row) => row.version !== target)
          if (wrong.length) {
            throw new Error(
              'mixed DSH runtime versions: '
                + wrong.map((row) => row.path + '@' + String(row.version)).join(', '),
            )
          }

          const observedLifecycle = Object.entries(lock.packages ?? {})
            .filter(([, entry]) => entry?.hasInstallScript === true)
            .map(([path, entry]) => ({
              name: packageNameFromLockPath(path),
              version: entry.version,
            }))
            .filter((entry) => entry.name !== null)
            .sort((a, b) => a.name.localeCompare(b.name))

          const reviewedNames = [...policy.allowed, ...policy.denied]
            .map((entry) => entry.name)
            .sort()
          const observedNames = observedLifecycle.map((entry) => entry.name).sort()

          if (JSON.stringify(reviewedNames) !== JSON.stringify(observedNames)) {
            throw new Error(
              'lifecycle package-name drift: reviewed=' + reviewedNames.join(',')
                + ' observed=' + observedNames.join(','),
            )
          }

          const versions = new Map(observedLifecycle.map((entry) => [entry.name, entry.version]))
          for (const group of [policy.allowed, policy.denied]) {
            for (const entry of group) entry.version = versions.get(entry.name)
          }
          writeFileSync(policyPath, JSON.stringify(policy, null, 2) + '\n')

          console.log('exact DSH lock entries:', dshRows.length)
          console.log('reviewed lifecycle names unchanged:', observedNames.join(', '))
          NODE

      - name: Extract official alpha.4 contracts
        run: |
          set -euo pipefail
          pnpm contracts:extract

      - name: Verify generated write boundary
        run: |
          set -euo pipefail
          git status --short
          python3 - <<'PY'
          import subprocess

          allowed = {
              'pnpm-lock.yaml',
              'apps/desktop/runtime-lock/package.json',
              'apps/desktop/runtime-lock/package-lock.json',
              'apps/desktop/runtime-lock/lifecycle-scripts.json',
              'contracts/upstream/exports.snapshot.json',
              'contracts/upstream/cli.snapshot.json',
              'contracts/upstream/config-rows.snapshot.json',
              'contracts/upstream/packages.snapshot.json',
          }
          changed = subprocess.check_output(
              ['git', 'status', '--porcelain=v1'], text=True
          ).splitlines()
          paths = {line[3:] for line in changed if len(line) >= 4}
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit('unexpected generated paths: ' + ', '.join(unexpected))

          required = {
              'pnpm-lock.yaml',
              'apps/desktop/runtime-lock/package-lock.json',
              'contracts/upstream/exports.snapshot.json',
              'contracts/upstream/cli.snapshot.json',
              'contracts/upstream/config-rows.snapshot.json',
              'contracts/upstream/packages.snapshot.json',
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit('expected alpha.4 generated paths unchanged/missing: ' + ', '.join(missing))
          PY

      - name: Commit generated alpha.4 evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             pnpm-lock.yaml             apps/desktop/runtime-lock/package.json             apps/desktop/runtime-lock/package-lock.json             apps/desktop/runtime-lock/lifecycle-scripts.json             contracts/upstream/exports.snapshot.json             contracts/upstream/cli.snapshot.json             contracts/upstream/config-rows.snapshot.json             contracts/upstream/packages.snapshot.json
          git commit -m 'chore(alpha4): regenerate locks and upstream contracts'
          git push origin HEAD:refs/heads/upgrade/dsh-0.1.2-alpha.4
