name: android-remote-acceptance

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-remote-client:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install verified Gradle 8.11.1
        run: |
          mkdir -p /tmp/gradle-install
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle-8.11.1-bin.zip
          echo "f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  /tmp/gradle-8.11.1-bin.zip" | sha256sum -c -
          unzip -q /tmp/gradle-8.11.1-bin.zip -d /tmp/gradle-install
          echo "/tmp/gradle-install/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Ensure Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Build host remote-adapter for live interop
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @dsh-community/shared-types --filter @dsh-community/dsh-bridge --filter @dsh-community/remote-adapter build

      - name: Run Android JVM unit tests and assemble debug, release, and androidTest APKs
        env:
          DSH_ANDROID_REQUIRE_LIVE_INTEROP: '1'
          DSH_ANDROID_INTEROP_HOST_SCRIPT: ${{ github.workspace }}/scripts/r5-android-interop-host.mjs
        run: |
          cd apps/android
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --info

      - name: Prove zero embedded Node or official DSH and verify WebRTC native libs in assembled APKs
        run: |
          cd apps/android
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK_PATH="$(find app/build/outputs/apk/release -maxdepth 2 -name '*.apk' | head -n 1)"
          TEST_APK_PATH="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -f "$APK_PATH"
          test -n "$RELEASE_APK_PATH"
          test -f "$RELEASE_APK_PATH"
          test -f "$TEST_APK_PATH"
          unzip -l "$APK_PATH" | tee /tmp/android-apk-entries.txt
          unzip -l "$RELEASE_APK_PATH" | tee /tmp/android-release-apk-entries.txt
          unzip -l "$TEST_APK_PATH" | tee /tmp/android-test-apk-entries.txt
          if grep -iE 'libnode\.so|nodejs-mobile|nodejs-project|@deepseek-ai/dsh|deepseek-ai|webkit' /tmp/android-apk-entries.txt /tmp/android-release-apk-entries.txt /tmp/android-test-apk-entries.txt; then
            echo "ERROR: APK contains forbidden embedded Node, WebView, or official DSH runtime entry" >&2
            exit 1
          fi
          grep -q 'libjingle_peerconnection_so.so' /tmp/android-apk-entries.txt
          grep -q 'libjingle_peerconnection_so.so' /tmp/android-release-apk-entries.txt
          sha256sum "$APK_PATH" "$RELEASE_APK_PATH" "$TEST_APK_PATH" | tee /tmp/android-apk-sha256.txt
          cd "${{ github.workspace }}"
          if node scripts/verify-android-release-ready.mjs; then
            echo "ERROR: verify-android-release-ready must stay fail-closed prior to physical arm64 R6 acceptance" >&2
            exit 1
          fi

      - name: Verify arm64-v8a ABI filtering, Release signing, and fail-closed config
        shell: bash
        run: |
          set -euo pipefail
          cd apps/android
          BACKUP_DIR="$(mktemp -d /tmp/dsh-orig-release-apks.XXXXXX)"
          KEYSTORE_FILE="$(mktemp -u /tmp/dsh-ci-ephemeral.XXXXXX).p12"
          cleanup() {
            rm -f "$KEYSTORE_FILE" /tmp/android-arm64-release-apk-entries.txt
            if [[ -d "$BACKUP_DIR/release" ]]; then
              rm -rf app/build/outputs/apk/release
              mv "$BACKUP_DIR/release" app/build/outputs/apk/release
            fi
            rm -rf "$BACKUP_DIR"
          }
          trap cleanup EXIT

          cp -a app/build/outputs/apk/release "$BACKUP_DIR/release"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE_FILE" \
            -storetype PKCS12 \
            -alias dshci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -storepass ci-store-secret \
            -keypass ci-key-secret \
            -dname "CN=DSH Community CI, OU=Android, O=DSH Community, L=NA, ST=NA, C=US"

          if DSH_ANDROID_KEYSTORE_PATH="$KEYSTORE_FILE" gradle --no-daemon :app:help >/dev/null 2>&1; then
            echo "ERROR: Partial signing config must fail Gradle configuration" >&2
            exit 1
          fi
          if DSH_ANDROID_SIGNING_REQUIRED=true gradle --no-daemon :app:help >/dev/null 2>&1; then
            echo "ERROR: DSH_ANDROID_SIGNING_REQUIRED=true without credentials must fail Gradle configuration" >&2
            exit 1
          fi
          if gradle --no-daemon -PdshAbiFilters=riscv64 :app:help >/dev/null 2>&1; then
            echo "ERROR: Unsupported ABI filter must fail Gradle configuration" >&2
            exit 1
          fi

          rm -rf app/build/outputs/apk/release
          DSH_ANDROID_SIGNING_REQUIRED=true \
          DSH_ANDROID_KEYSTORE_PATH="$KEYSTORE_FILE" \
          DSH_ANDROID_KEYSTORE_PASSWORD="ci-store-secret" \
          DSH_ANDROID_KEY_ALIAS="dshci" \
          DSH_ANDROID_KEY_PASSWORD="ci-key-secret" \
          gradle --no-daemon -PdshAbiFilters=arm64-v8a :app:assembleRelease --info

          ARM64_RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$ARM64_RELEASE_APK"
          test ! -f "app/build/outputs/apk/release/app-release-unsigned.apk"

          unzip -l "$ARM64_RELEASE_APK" | tee /tmp/android-arm64-release-apk-entries.txt
          grep -q 'lib/arm64-v8a/libjingle_peerconnection_so.so' /tmp/android-arm64-release-apk-entries.txt
          if grep -qE 'lib/(x86_64|x86|armeabi-v7a)/' /tmp/android-arm64-release-apk-entries.txt; then
            echo "ERROR: arm64-v8a filtered APK unexpectedly includes non-arm64 native libraries" >&2
            exit 1
          fi
          if grep -iE 'libnode\.so|nodejs-mobile|nodejs-project|@deepseek-ai/dsh|deepseek-ai|webkit' /tmp/android-arm64-release-apk-entries.txt; then
            echo "ERROR: arm64-v8a signed APK contains forbidden embedded runtime entry" >&2
            exit 1
          fi

          APKSIGNER_BIN="$(command -v apksigner || find "${ANDROID_SDK_ROOT:-/nonexistent}/build-tools" "${ANDROID_HOME:-/nonexistent}/build-tools" /usr/local/lib/android/sdk/build-tools -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          test -n "$APKSIGNER_BIN"
          test -x "$APKSIGNER_BIN"
          "$APKSIGNER_BIN" verify --verbose "$ARM64_RELEASE_APK"
          ls -lh "$ARM64_RELEASE_APK"
          sha256sum "$ARM64_RELEASE_APK"

      - name: Upload assembled R6 APKs for emulator acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-r6-debug-apks
          retention-days: 1
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Upload Android R5/R6 build and interop evidence logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-r5-remote-acceptance-evidence
          retention-days: 3
          path: |
            /tmp/android-apk-entries.txt
            /tmp/android-test-apk-entries.txt
            /tmp/android-apk-sha256.txt
            apps/android/app/build/test-results/testDebugUnitTest/*.xml

  android-emulator-r6:
    needs: android-remote-client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-r6-debug-apks
          path: apps/android/app/build/outputs/apk

      - name: Detect KVM support on runner
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM_ENABLED=1" >> "$GITHUB_ENV"
          else
            echo "KVM_ENABLED=0" >> "$GITHUB_ENV"
            echo "WARNING: /dev/kvm is not accessible; x86_64 emulator instrumentation skipped on this runner."
          fi

      - name: Install Android API 34 x86_64 emulator image and boot AVD
        if: env.KVM_ENABLED == '1'
        run: |
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/emulator" >> "$GITHUB_PATH"
          export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/emulator:${PATH}"
          mkdir -p "${HOME}/.android/avd" "${{ github.workspace }}/apps/android/app/build/r6-evidence"
          export ANDROID_USER_HOME="${HOME}/.android"
          export ANDROID_AVD_HOME="${HOME}/.android/avd"
          echo "ANDROID_USER_HOME=${HOME}/.android" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=${HOME}/.android/avd" >> "$GITHUB_ENV"
          SDK_TOOLS="${ANDROID_HOME}/cmdline-tools/latest/bin"
          yes | "${SDK_TOOLS}/sdkmanager" --licenses >/dev/null || true
          "${SDK_TOOLS}/sdkmanager" "platform-tools" "emulator" "system-images;android-34;default;x86_64"
          echo "no" | "${SDK_TOOLS}/avdmanager" create avd --force -n dsh-r6-api34 -k "system-images;android-34;default;x86_64" --abi x86_64
          ls -la "${ANDROID_AVD_HOME}"
          "${ANDROID_HOME}/emulator/emulator" -list-avds
          nohup "${ANDROID_HOME}/emulator/emulator" -avd dsh-r6-api34 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > apps/android/app/build/r6-evidence/android-emulator.log 2>&1 &
          EMU_PID=$!
          for i in $(seq 1 90); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "ERROR: Android emulator process exited prematurely" >&2
              cat apps/android/app/build/r6-evidence/android-emulator.log || true
              exit 1
            fi
            BOOTED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$BOOTED" = "1" ]; then
              break
            fi
            sleep 2
          done
          if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" != "1" ]; then
            cat apps/android/app/build/r6-evidence/android-emulator.log || true
            exit 1
          fi
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell svc power stayon true || true
          adb shell input keyevent 224 || true
          adb shell wm dismiss-keyguard || true
          adb shell input keyevent 82 || true

      - name: Build host remote-adapter and run R6 instrumentation acceptance on emulator
        if: env.KVM_ENABLED == '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @dsh-community/shared-types --filter @dsh-community/dsh-bridge --filter @dsh-community/remote-adapter build
          APK_PATH="$(find apps/android/app/build/outputs/apk -name 'app-debug.apk' | head -n 1)"
          TEST_APK_PATH="$(find apps/android/app/build/outputs/apk -name 'app-debug-androidTest.apk' | head -n 1)"
          test -n "$APK_PATH"
          test -n "$TEST_APK_PATH"
          node scripts/accept-android-r6-device.mjs --apk "$APK_PATH" --test-apk "$TEST_APK_PATH" --output apps/android/app/build/r6-evidence/r6-emulator-acceptance.json
          node -e "const r=JSON.parse(require('fs').readFileSync('apps/android/app/build/r6-evidence/r6-emulator-acceptance.json','utf8')); if (r.apk.arm64RealDeviceSmoke !== false || r.apk.x86_64EmulatorSmoke !== true || r.remoteAcceptance.pairing !== 'PASS') process.exit(1);"
          if node scripts/verify-android-release-ready.mjs; then
            echo "ERROR: emulator acceptance must never unlock physical arm64 release gate" >&2
            exit 1
          fi

      - name: Capture logcat and stop Android emulator
        if: always() && env.KVM_ENABLED == '1'
        run: |
          mkdir -p apps/android/app/build/r6-evidence
          {
            echo "=== DshWebRtc & TestRunner Logcat ==="
            adb logcat -d -s DshWebRtc:V TestRunner:V || true
            echo "=== Recent Logcat Tail (250) ==="
            adb logcat -d -t 250 || true
          } > apps/android/app/build/r6-evidence/android-logcat.txt || true
          adb emu kill || true

      - name: Upload R6 emulator instrumentation acceptance evidence
        if: always() && env.KVM_ENABLED == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-r6-emulator-acceptance
          retention-days: 3
          path: |
            apps/android/app/build/r6-evidence/r6-emulator-acceptance.json
            apps/android/app/build/r6-evidence/android-emulator.log
            apps/android/app/build/r6-evidence/android-logcat.txt
