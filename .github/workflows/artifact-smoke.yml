name: artifact-smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag to verify (e.g. v0.1.2)'
        default: 'v0.1.2'
  schedule:
    - cron: '17 4 * * *'

jobs:
  windows-exact:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Download the exact release installer + sha256
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag || 'v0.1.2' }}'
          Invoke-WebRequest -Uri "https://github.com/kamanager2012/dsh-community/releases/download/$tag/DSH.Community.Setup.$($tag.TrimStart('v')).exe" -OutFile setup.exe
          Invoke-WebRequest -Uri "https://github.com/kamanager2012/dsh-community/releases/download/$tag/DSH.Community.Setup.$($tag.TrimStart('v')).exe.sha256" -OutFile setup.exe.sha256
          $expected = (Get-Content setup.exe.sha256).Split(' ')[0].ToLower()
          $actual = (Get-FileHash setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "sha256 mismatch: $actual vs $expected" }
          Write-Output "sha256 OK"
      - name: Silent install
        shell: pwsh
        run: Start-Process -FilePath .\setup.exe -ArgumentList '/S' -Wait
      - name: First launch and official runtime readiness
        shell: pwsh
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\DSH Community\DSH Community.exe"
          if (!(Test-Path $exe)) { throw "installed exe missing: $exe" }
          $env:DSH_COMMUNITY_ISOLATED = '1'
          $proc = Start-Process -FilePath $exe -PassThru
          $logDir = "$env:APPDATA\DSH Community\logs"
          $ready = $false
          foreach ($i in 1..120) {
            Start-Sleep -Seconds 1
            if (Test-Path "$logDir\host.log") {
              $content = Get-Content "$logDir\host.log" -Raw -ErrorAction SilentlyContinue
              if ($content -match 'dsh web: http://127\.0\.0\.1:(\d+)') {
                $port = $Matches[1]
                $ready = $true
                break
              }
            }
          }
          if (!$ready) { throw 'official runtime did not become ready in 120s' }
          $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 10
          Write-Output "official web status: $($response.StatusCode)"
          if ($response.StatusCode -ge 500) { throw "official web returned $($response.StatusCode)" }
          Stop-Process -Id $proc.Id -Force
      - name: No leftover processes
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          $left = Get-Process -Name 'DSH Community' -ErrorAction SilentlyContinue
          if ($left) { throw 'DSH Community still running after quit' }

  macos-exact:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Download the exact release dmg + sha256
        run: |
          TAG="${TAG_INPUT:-v0.1.2}"
          curl -sL -o app.dmg "https://github.com/kamanager2012/dsh-community/releases/download/${TAG}/dsh-community-${TAG#v}.dmg"
          curl -sL -o app.dmg.sha256 "https://github.com/kamanager2012/dsh-community/releases/download/${TAG}/dsh-community-${TAG#v}.dmg.sha256"
          expected=$(cut -d' ' -f1 app.dmg.sha256)
          actual=$(shasum -a 256 app.dmg | cut -d' ' -f1)
          [ "$expected" = "$actual" ] || { echo "sha256 mismatch: $actual vs $expected"; exit 1; }
          echo "sha256 OK"
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
      - name: Mount, copy, launch, readiness
        run: |
          hdiutil attach app.dmg -nobrowse -quiet
          app=$(ls -d /Volumes/*/*.app | head -1)
          cp -R "$app" "$RUNNER_TEMP/DSH Community.app"
          DSH_COMMUNITY_ISOLATED=1 "$RUNNER_TEMP/DSH Community.app/Contents/MacOS/DSH Community" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          LOGDIR="$HOME/Library/Application Support/DSH Community/logs"
          PORT=""
          for i in $(seq 1 120); do
            sleep 1
            if [ -f "$LOGDIR/host.log" ]; then
              PORT=$(grep -oP 'http://127\.0\.0\.1:\K\d+' "$LOGDIR/host.log" | head -1)
              [ -n "$PORT" ] && break
            fi
          done
          [ -n "$PORT" ] || { cat "$RUNNER_TEMP/smoke.log"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:$PORT/")
          echo "official web status: $code"
          [ "$code" -lt 500 ] || exit 1
          pkill -f "DSH Community" || true
          sleep 5
          pgrep -f "DSH Community" > /dev/null && { echo "still running after quit"; exit 1; } || echo "clean quit"
