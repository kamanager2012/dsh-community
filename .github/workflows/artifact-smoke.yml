name: artifact-smoke

# Exact-release subset of the Distribution Reality Gate (Complementary Edition).
# Complementary Community endpoints built/shipped by this repository:
#   Linux AppImage   → dsh-community-<version>.AppImage from the tag
#   WSL/Linux TUI    → dsh-community from the same tag
# Windows and macOS Desktop are delivered upstream by official deepseek-harness.
# This is extract / checksum / missing-key smoke. It is not a full user loop.

on:
  pull_request:
    paths:
      - '.github/workflows/artifact-smoke.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag to verify (empty = GitHub Latest)'
        required: false
        default: ''

# Every job is read-only against the repository: release metadata reads,
# asset downloads, and local install/launch smoke checks. Nothing writes back.
permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          else
            TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "verifying $TAG"

  verify-signatures:
    needs: resolve
    # Cosign keyless verification of the exact release assets (Latest by default,
    # or the workflow_dispatch tag). Signing transition is now closed:
    #   - no *.sigstore.json bundle on an explicit pre-signing legacy tag → WARN
    #   - no bundle on any other tag → hard FAIL
    #   - at least one bundle present → strict mode: EVERY released asset must
    #     have a matching bundle that passes cosign verify-blob against this
    #     exact tag's release.yml identity; anything
    #     missing or failing is a hard FAIL. A new unsigned release turns the
    #     daily smoke red on purpose — that closed loop is intentional.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Scan release for cosign bundles
        id: scan
        run: |
          set -euo pipefail
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "== assets of $TAG =="
          names=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --paginate --jq '.assets[].name')
          printf '%s\n' "$names"
          bundles=$(printf '%s\n' "$names" | grep -c '\.sigstore\.json$' || true)
          if [ "$bundles" -eq 0 ]; then
            case "$TAG" in
              v0.1.0-preview|v0.1.1-preview|v0.1.1|v0.1.2-preview|v0.1.2|v0.1.3|v0.1.4|v0.1.1-rc.1)
                echo "::warning::$TAG is an explicit pre-signing legacy release; signature verification skipped"
                echo "mode=legacy" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "::error::$TAG has no cosign bundles but is not in the explicit pre-signing legacy allowlist"
                exit 1
                ;;
            esac
          else
            echo "found $bundles bundle(s); entering strict mode"
            echo "mode=strict" >> "$GITHUB_OUTPUT"
          fi
      # sigstore/cosign-installer v3.10.1 (latest v3.x line)
      # cosign v2.6.1: the installer's self-verification downloads
      # cosign-linux-amd64.sig, which the v3.x release line no longer ships
      # (same curl 22 seen in the release sign job). v2.6.1 verifies the
      # .sigstore.json bundles with the same keyless flags.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.6.1'
      - name: Verify every asset against its keyless bundle (strict)
        if: steps.scan.outputs.mode == 'strict'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/verify"; mkdir -p "$work"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --paginate \
            --jq '.assets[] | [.name, .browser_download_url] | @tsv' > "$work/assets.tsv"
          verified=0; fail=0
          while IFS=$'\t' read -r name url; do
            case "$name" in *.sigstore.json) continue ;; esac
            bundle="$name.sigstore.json"
            bundle_url=$(awk -F'\t' -v n="$bundle" '$1 == n { print $2 }' "$work/assets.tsv")
            if [ -z "$bundle_url" ]; then
              echo "::error::$bundle missing for released asset $name (unsigned publish is not allowed)"
              fail=$((fail+1)); continue
            fi
            echo "== verifying $name =="
            curl -fSL --retry 3 -o "$work/$name" "$url"
            curl -fSL --retry 3 -o "$work/$bundle" "$bundle_url"
            identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/$TAG"
            if cosign verify-blob \
              --bundle "$work/$bundle" \
              --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
              --certificate-identity "$identity" \
              "$work/$name"; then
              verified=$((verified+1))
            else
              echo "::error::cosign verification FAILED for $name"
              fail=$((fail+1))
            fi
          done < "$work/assets.tsv"
          echo "verified=$verified failed=$fail"
          if [ "$verified" -eq 0 ]; then
            echo "::error::strict mode but nothing verified; refusing to pass"
            fail=$((fail+1))
          fi
          [ "$fail" -eq 0 ] || { echo "signature verification failures: $fail"; exit 1; }
      - name: Legacy signature notice
        if: steps.scan.outputs.mode == 'legacy'
        run: |
          echo "release $TAG is explicitly allowlisted as pre-signing history; only this signature gate is skipped"

  linux-appimage:
    needs: resolve
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the exact Linux AppImage + sha256
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          URL="https://github.com/kamanager2012/dsh-community/releases/download/${TAG}/dsh-community-${VER}.AppImage"
          echo "GET $URL"
          curl -fSL -o app.AppImage "$URL"
          curl -fSL -o app.AppImage.sha256 "${URL}.sha256"
          expected=$(cut -d' ' -f1 app.AppImage.sha256 | tr '[:upper:]' '[:lower:]')
          actual=$(sha256sum app.AppImage | cut -d' ' -f1)
          [ "$expected" = "$actual" ] || { echo "sha256 mismatch: $actual vs $expected"; exit 1; }
          echo "sha256 OK ($(wc -c < app.AppImage) bytes)"
      - name: Extract AppImage without FUSE and verify bundled runtime
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/appimage-smoke"
          rm -rf "$work"
          mkdir -p "$work"
          cp app.AppImage "$work/app.AppImage"
          cd "$work"
          chmod +x app.AppImage
          ./app.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/dsh-community
          test -s squashfs-root/resources/app.asar
          test -s squashfs-root/resources/host/official-dsh.tar
          echo "linux AppImage extract OK on $TAG"

  linux-terminal:
    needs: resolve
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: WSL/Linux Terminal endpoint (missing-key / no-TTY)
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          unset DEEPSEEK_API_KEY
          mkdir -p "$DSH_HOME"
          # Fresh clone only has sources. TUI tsc needs workspace dist first.
          if [ -f package.json ] && grep -q '"build:tui"' package.json; then
            pnpm build:tui
          fi
          pnpm --filter @dsh-community/tui build
          bin=apps/tui/dist/bin.js
          test -f "$bin"
          echo "== help =="
          node "$bin" help > help.out
          cat help.out
          grep -q 'dsh-community new' help.out
          echo "== version =="
          node "$bin" version > version.out
          cat version.out
          grep -q '@deepseek-ai/dsh' version.out
          echo "== doctor (no key → exit 2) =="
          set +e
          node "$bin" doctor > doctor.out
          code=$?
          set -e
          cat doctor.out
          test "$code" -eq 2
          grep -q '未设置 DEEPSEEK_API_KEY' doctor.out
          grep -q '@deepseek-ai/dsh' doctor.out
          echo "== sessions =="
          node "$bin" sessions > sessions.out
          cat sessions.out
          echo "== default launch without TTY must refuse =="
          set +e
          node "$bin" > launch.out 2>&1
          code=$?
          set -e
          cat launch.out
          test "$code" -ne 0
          grep -q '开聊需要交互终端' launch.out
          echo "linux terminal endpoint OK on $TAG"
