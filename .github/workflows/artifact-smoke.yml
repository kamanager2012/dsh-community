name: artifact-smoke

# Exact-release subset of the Distribution Reality Gate.
# Primary Community endpoints:
#   Windows Desktop  → Setup.exe from the tag
#   macOS Desktop    → dmg from the tag
#   WSL/Linux TUI    → dsh-community from the same tag (not AppImage)
# This is install / first-ready / missing-key. It is not a full user loop.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag to verify (empty = GitHub Latest)'
        required: false
        default: ''
  schedule:
    - cron: '17 4 * * *'

# Every job is read-only against the repository: release metadata reads,
# asset downloads, and local install/launch smoke checks. Nothing writes back.
permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          else
            TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "verifying $TAG"

  verify-signatures:
    # Cosign keyless verification of the exact release assets (Latest by default,
    # or the workflow_dispatch tag). One-time transition design:
    #   - no *.sigstore.json bundle on the target release  → ::warning:: WARN, exit 0
    #     (releases cut before signing went live stay green)
    #   - at least one bundle present                      → strict mode: EVERY
    #     released asset must have a matching bundle that passes
    #     cosign verify-blob against this repo's release.yml identity; anything
    #     missing or failing is a hard FAIL. A new unsigned release turns the
    #     daily smoke red on purpose — that closed loop is intentional.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
      # Fulcio bakes the triggering workflow + ref into the certificate SAN:
      # https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/<tag>
      COSIGN_IDENTITY_REGEXP: '^https://github.com/kamanager2012/dsh-community/\.github/workflows/release\.yml@refs/tags/'
    steps:
      - name: Scan release for cosign bundles
        id: scan
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "== assets of $TAG =="
          names=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --paginate --jq '.assets[].name')
          printf '%s\n' "$names"
          bundles=$(printf '%s\n' "$names" | grep -c '\.sigstore\.json$' || true)
          if [ "$bundles" -eq 0 ]; then
            echo "::warning::$TAG carries no cosign bundles yet (pre-signing release); strict signature verification skipped"
            echo "mode=transition" >> "$GITHUB_OUTPUT"
          else
            echo "found $bundles bundle(s); entering strict mode"
            echo "mode=strict" >> "$GITHUB_OUTPUT"
          fi
      # sigstore/cosign-installer v3.10.1 (latest v3.x line)
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v3.1.3'
      - name: Verify every asset against its keyless bundle (strict)
        if: steps.scan.outputs.mode == 'strict'
        env:
          TAG: ${{ steps.scan.outputs.tag }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/verify"; mkdir -p "$work"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --paginate \
            --jq '.assets[] | [.name, .browser_download_url] | @tsv' > "$work/assets.tsv"
          verified=0; fail=0
          while IFS=$'\t' read -r name url; do
            case "$name" in *.sigstore.json) continue ;; esac
            bundle="$name.sigstore.json"
            bundle_url=$(awk -F'\t' -v n="$bundle" '$1 == n { print $2 }' "$work/assets.tsv")
            if [ -z "$bundle_url" ]; then
              echo "::error::$bundle missing for released asset $name (unsigned publish is not allowed)"
              fail=$((fail+1)); continue
            fi
            echo "== verifying $name =="
            curl -fSL --retry 3 -o "$work/$name" "$url"
            curl -fSL --retry 3 -o "$work/$bundle" "$bundle_url"
            if cosign verify-blob \
              --bundle "$work/$bundle" \
              --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
              --certificate-identity-regexp "$COSIGN_IDENTITY_REGEXP" \
              "$work/$name"; then
              verified=$((verified+1))
            else
              echo "::error::cosign verification FAILED for $name"
              fail=$((fail+1))
            fi
          done < "$work/assets.tsv"
          echo "verified=$verified failed=$fail"
          if [ "$verified" -eq 0 ]; then
            echo "::error::strict mode but nothing verified; refusing to pass"
            fail=$((fail+1))
          fi
          [ "$fail" -eq 0 ] || { echo "signature verification failures: $fail"; exit 1; }
      - name: Transition notice (unsigned legacy release)
        if: steps.scan.outputs.mode == 'transition'
        run: |
          echo "release ${{ steps.scan.outputs.tag }} predates keyless signing; only sha256 sidecar checks apply in this mode"

  windows-desktop:
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the exact Windows Setup + sha256
        shell: pwsh
        run: |
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'User-Agent' = 'dsh-community-artifact-smoke'
          }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG"
          $asset = @($release.assets | Where-Object { $_.name -match '\.exe$' } | Select-Object -First 1)
          if (-not $asset) { throw "no .exe asset found for $env:TAG" }
          $hashAsset = @($release.assets | Where-Object { $_.name -eq "$($asset.name).sha256" } | Select-Object -First 1)
          if (-not $hashAsset) { throw "no checksum sidecar found for $($asset.name)" }
          $url = $asset.browser_download_url
          $hashUrl = $hashAsset.browser_download_url
          Write-Host "selected asset: $($asset.name)"
          Write-Host "GET $url"
          curl.exe -fSL -o setup.exe $url
          curl.exe -fSL -o setup.exe.sha256 $hashUrl
          $expected = (Get-Content setup.exe.sha256).Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)[0].ToLower()
          $actual = (Get-FileHash setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "sha256 mismatch: $actual vs $expected" }
          Write-Output "sha256 OK ($((Get-Item setup.exe).Length) bytes)"
      - name: Silent per-user install
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\setup.exe -ArgumentList '/S' -PassThru -Wait
          Write-Host "installer exit: $($p.ExitCode)"
      - name: First launch and official runtime readiness
        shell: pwsh
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\DSH Community\DSH Community.exe",
            "$env:LOCALAPPDATA\Programs\dsh-community\DSH Community.exe",
            "$env:LOCALAPPDATA\Programs\dsh-community-desktop\DSH Community.exe"
          )
          $exe = $null
          foreach ($i in 1..90) {
            foreach ($c in $candidates) {
              if (Test-Path $c) { $exe = $c; break }
            }
            if (-not $exe) {
              $roots = @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}")
              foreach ($root in $roots) {
                if (-not (Test-Path $root)) { continue }
                $found = Get-ChildItem $root -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -match 'DSH|dsh-community' } |
                  Select-Object -First 1
                if ($found) { $exe = $found.FullName; break }
              }
            }
            if ($exe) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $exe) {
            Write-Host "=== Programs tree ==="
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 80 | ForEach-Object { Write-Host $_.FullName }
            Write-Host "=== Uninstall keys ==="
            Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -match 'DSH|dsh' } |
              Format-List DisplayName, InstallLocation, DisplayIcon
            throw "installed exe not found after silent install"
          }
          Write-Host "launching: $exe"
          $env:DSH_COMMUNITY_ISOLATED = '1'
          $proc = Start-Process -FilePath $exe -PassThru
          $ready = $false
          $port = $null
          $hostLog = $null
          foreach ($i in 1..300) {
            Start-Sleep -Seconds 1
            $logs = [System.Collections.Generic.List[string]]::new()
            foreach ($p in @(
              "$env:APPDATA\DSH Community\logs\host.log",
              "$env:APPDATA\dsh-community-desktop\logs\host.log"
            )) { $logs.Add($p) }
            if (($i % 15) -eq 0 -and (Test-Path $env:APPDATA)) {
              Get-ChildItem $env:APPDATA -Recurse -Filter 'host.log' -ErrorAction SilentlyContinue |
                Select-Object -First 8 | ForEach-Object { $logs.Add($_.FullName) }
            }
            foreach ($candidate in ($logs | Select-Object -Unique)) {
              if (-not (Test-Path $candidate)) { continue }
              $content = Get-Content $candidate -Raw -ErrorAction SilentlyContinue
              if ($content -match 'dsh web: http://127\.0\.0\.1:(\d+)') {
                $port = $Matches[1]
                $ready = $true
                $hostLog = $candidate
                break
              }
            }
            if ($ready) { break }
          }
          if (-not $ready) {
            Write-Host "=== host.log candidates ==="
            Get-ChildItem $env:APPDATA -Recurse -Filter 'host.log' -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName -ErrorAction SilentlyContinue }
            throw 'official runtime did not become ready in 300s'
          }
          Write-Host "ready from $hostLog port $port"
          $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 10
          Write-Output "official web status: $($response.StatusCode)"
          if ($response.StatusCode -ge 500) { throw "official web returned $($response.StatusCode)" }
          Stop-Process -Id $proc.Id -Force
      - name: No leftover processes
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          $left = Get-Process -Name 'DSH Community' -ErrorAction SilentlyContinue
          if ($left) { throw 'DSH Community still running after quit' }

  macos-desktop:
    needs: resolve
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Download the exact macOS dmg + sha256
        run: |
          VER="${TAG#v}"
          URL="https://github.com/kamanager2012/dsh-community/releases/download/${TAG}/dsh-community-${VER}.dmg"
          echo "GET $URL"
          curl -fSL -o app.dmg "$URL"
          curl -fSL -o app.dmg.sha256 "${URL}.sha256"
          expected=$(cut -d' ' -f1 app.dmg.sha256)
          actual=$(shasum -a 256 app.dmg | cut -d' ' -f1)
          [ "$expected" = "$actual" ] || { echo "sha256 mismatch: $actual vs $expected"; exit 1; }
          echo "sha256 OK ($(wc -c < app.dmg) bytes)"
      - name: Mount, copy, launch, readiness
        run: |
          hdiutil attach app.dmg -nobrowse -quiet
          app=$(ls -d /Volumes/*/*.app | head -1)
          echo "mounted app: $app"
          cp -R "$app" "$RUNNER_TEMP/DSH Community.app"
          DSH_COMMUNITY_ISOLATED=1 "$RUNNER_TEMP/DSH Community.app/Contents/MacOS/DSH Community" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          LOGDIR="$HOME/Library/Application Support/DSH Community/logs"
          PORT=""
          for i in $(seq 1 300); do
            sleep 1
            for f in "$LOGDIR/host.log" \
              "$HOME/Library/Application Support/dsh-community-desktop/logs/host.log" \
              "$RUNNER_TEMP/smoke.log"; do
              if [ -f "$f" ]; then
                PORT=$(sed -n 's/.*http:\/\/127\.0\.0\.1:\([0-9]*\).*/\1/p' "$f" | head -1)
                [ -n "$PORT" ] && break
              fi
            done
            [ -n "$PORT" ] && break
          done
          if [ -z "$PORT" ]; then
            echo "=== smoke.log ==="; cat "$RUNNER_TEMP/smoke.log" || true
            echo "=== host.log ==="; cat "$LOGDIR/host.log" || true
            find "$HOME/Library/Application Support" -name host.log -print -exec cat {} \; 2>/dev/null || true
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:$PORT/")
          echo "official web status: $code"
          [ "$code" -lt 500 ] || exit 1
          pkill -f "DSH Community" || true
          sleep 5
          pgrep -f "DSH Community" > /dev/null && { echo "still running after quit"; exit 1; } || echo "clean quit"

  linux-terminal:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: WSL/Linux Terminal endpoint (missing-key / no-TTY)
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          unset DEEPSEEK_API_KEY
          mkdir -p "$DSH_HOME"
          # Fresh clone only has sources. TUI tsc needs workspace dist first.
          if [ -f package.json ] && grep -q '"build:tui"' package.json; then
            pnpm build:tui
          fi
          pnpm --filter @dsh-community/tui build
          bin=apps/tui/dist/bin.js
          test -f "$bin"
          echo "== help =="
          node "$bin" help > help.out
          cat help.out
          grep -q 'dsh-community new' help.out
          echo "== version =="
          node "$bin" version > version.out
          cat version.out
          grep -q '@deepseek-ai/dsh' version.out
          echo "== doctor (no key → exit 2) =="
          set +e
          node "$bin" doctor > doctor.out
          code=$?
          set -e
          cat doctor.out
          test "$code" -eq 2
          grep -q '未设置 DEEPSEEK_API_KEY' doctor.out
          grep -q '@deepseek-ai/dsh' doctor.out
          echo "== sessions =="
          node "$bin" sessions > sessions.out
          cat sessions.out
          echo "== default launch without TTY must refuse =="
          set +e
          node "$bin" > launch.out 2>&1
          code=$?
          set -e
          cat launch.out
          test "$code" -ne 0
          grep -q '开聊需要交互终端' launch.out
          echo "linux terminal endpoint OK on $TAG"
