name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# CI only checks out, builds, and tests. No job writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Catalog shape
        run: node packages/marketplace/scripts/verify.mjs --offline
      - name: Evidence runner syntax
        run: python3 -m py_compile scripts/e2e/user-loop.py
      - name: Test and official contracts
        run: pnpm test
