name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# CI only checks out, builds, and tests. No job writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Catalog shape
        run: node packages/marketplace/scripts/verify.mjs --offline
      - name: Evidence runner syntax
        run: python3 -m py_compile scripts/e2e/user-loop.py
      - name: Test and official contracts
        run: pnpm test
