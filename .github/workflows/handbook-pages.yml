name: Publish handbook documentation site

on:
  push:
    branches:
      - main
    paths:
      - "handbook/**"
      - ".github/workflows/handbook-pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "handbook/**"
      - ".github/workflows/handbook-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handbook-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: handbook/requirements-docs.txt

      - name: Install documentation tools
        run: python -m pip install -r handbook/requirements-docs.txt

      - name: Validate handbook
        run: python handbook/scripts/validate_handbook.py

      - name: Validate AI catalog freshness
        run: python handbook/scripts/build_ai_catalog.py --check

      - name: Validate AI catalog source ranges
        run: python handbook/scripts/validate_ai_catalog.py

      - name: Run bilingual retrieval regression
        run: >-
          python handbook/scripts/evaluate_retrieval.py
          --min-recall-at-5 0.80
          --min-mrr 0.65
          --min-source-accuracy-at-1 0.70
          --min-term-coverage 0.90

      - name: Prepare reader source
        run: python handbook/scripts/build_docs_source.py

      - name: Build site
        run: mkdocs build -f handbook/mkdocs.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: handbook/.mkdocs-site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
