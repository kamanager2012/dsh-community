name: linux-macos-package-smoke

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/linux-macos-package-smoke.yml'
      - 'apps/desktop/**'
      - 'packages/dsh-bridge/**'
      - 'packages/shared-types/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-appimage
            os: ubuntu-latest
            packageArg: --appimage
            extension: AppImage
          - label: macos-dmg
            os: macos-latest
            packageArg: --mac
            extension: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Package exact release target
        run: pnpm desktop:package -- ${{ matrix.packageArg }}

      - name: Asar vendor=0 guard
        run: pnpm vitest run apps/desktop/tests/asar-purity.test.ts

      - name: Generate release checksum
        shell: bash
        run: node scripts/checksum-release.mjs 'apps/desktop/release/*.${{ matrix.extension }}'

      - name: Verify artifact bytes and checksum sidecar
        shell: bash
        env:
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const crypto = require('crypto')
          const dir = path.join('apps', 'desktop', 'release')
          const suffix = '.' + process.env.EXTENSION
          const files = fs.readdirSync(dir)
            .filter((name) => name.endsWith(suffix))
            .sort()
          if (files.length < 1) throw new Error('no packaged artifact with suffix ' + suffix)
          for (const name of files) {
            const asset = path.join(dir, name)
            const sidecar = asset + '.sha256'
            if (!fs.existsSync(sidecar) || fs.statSync(sidecar).size === 0) {
              throw new Error('missing/empty checksum sidecar for ' + name)
            }
            const expected = fs.readFileSync(sidecar, 'utf8').trim().split(/\s+/u)[0]?.toLowerCase()
            const actual = crypto.createHash('sha256').update(fs.readFileSync(asset)).digest('hex')
            if (expected !== actual) throw new Error('sha256 mismatch for ' + name)
            console.log('sha256 OK:', name, fs.statSync(asset).size, 'bytes')
          }
          NODE

      - name: Extract AppImage filesystem without FUSE
        if: ${{ matrix.label == 'linux-appimage' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(apps/desktop/release/*.AppImage)
          [ "${#files[@]}" -ge 1 ]
          artifact="$GITHUB_WORKSPACE/${files[0]}"
          work="$RUNNER_TEMP/appimage-extract"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          chmod +x "$artifact"
          "$artifact" --appimage-extract >/dev/null
          test -d squashfs-root
          app_asar=$(find squashfs-root -type f -name app.asar -print -quit)
          test -n "$app_asar"
          echo "AppImage extract OK: $app_asar"

      - name: Mount DMG and verify app bundle
        if: ${{ matrix.label == 'macos-dmg' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(apps/desktop/release/*.dmg)
          [ "${#files[@]}" -ge 1 ]
          artifact="$GITHUB_WORKSPACE/${files[0]}"
          mount="$RUNNER_TEMP/dsh-community-dmg"
          rm -rf "$mount"
          mkdir -p "$mount"
          cleanup() { hdiutil detach "$mount" -quiet || true; }
          trap cleanup EXIT
          hdiutil attach "$artifact" -nobrowse -readonly -mountpoint "$mount" -quiet
          app=$(find "$mount" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          executable=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)
          test -n "$executable"
          echo "DMG mount OK: $app"
