name: linux-package-smoke

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/linux-package-smoke.yml'
      - 'apps/desktop/**'
      - 'packages/dsh-bridge/**'
      - 'packages/remote-adapter/**'
      - 'packages/shared-types/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/linux-appimage-gui-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package (linux-appimage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Package exact release target
        run: pnpm desktop:package -- --appimage

      - name: Asar vendor=0 guard
        run: pnpm vitest run apps/desktop/tests/asar-purity.test.ts

      - name: Generate release checksum
        shell: bash
        run: node scripts/checksum-release.mjs 'apps/desktop/release/*.AppImage'

      - name: Verify artifact bytes and checksum sidecar
        shell: bash
        env:
          EXTENSION: AppImage
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const crypto = require('crypto')
          const dir = path.join('apps', 'desktop', 'release')
          const suffix = '.' + process.env.EXTENSION
          const files = fs.readdirSync(dir)
            .filter((name) => name.endsWith(suffix))
            .sort()
          if (files.length < 1) throw new Error('no packaged artifact with suffix ' + suffix)
          for (const name of files) {
            const asset = path.join(dir, name)
            const sidecar = asset + '.sha256'
            if (!fs.existsSync(sidecar) || fs.statSync(sidecar).size === 0) {
              throw new Error('missing/empty checksum sidecar for ' + name)
            }
            const expected = fs.readFileSync(sidecar, 'utf8').trim().split(/\s+/u)[0]?.toLowerCase()
            const actual = crypto.createHash('sha256').update(fs.readFileSync(asset)).digest('hex')
            if (expected !== actual) throw new Error('sha256 mismatch for ' + name)
            console.log('sha256 OK:', name, fs.statSync(asset).size, 'bytes')
          }
          NODE

      - name: Extract AppImage filesystem without FUSE
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(apps/desktop/release/*.AppImage)
          [ "${#files[@]}" -ge 1 ]
          artifact="$GITHUB_WORKSPACE/${files[0]}"
          work="$RUNNER_TEMP/appimage-extract"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          chmod +x "$artifact"
          "$artifact" --appimage-extract >/dev/null
          test -d squashfs-root
          app_asar=$(find squashfs-root -type f -name app.asar -print -quit)
          test -n "$app_asar"
          host_tar=$(find squashfs-root -type f -name official-dsh.tar -print -quit)
          test -n "$host_tar"
          remote_plugin=$(find squashfs-root -path '*/resources/remote/cordis-plugin.mjs' -print -quit)
          test -n "$remote_plugin"
          node --input-type=module -e "import { pathToFileURL } from 'node:url'; import { resolve } from 'node:path'; const m = await import(pathToFileURL(resolve(process.argv[1])).href); if (m.name !== 'dsh-community-remote' || typeof m.apply !== 'function') process.exit(1);" "$remote_plugin"
          echo "AppImage extract OK: $app_asar ($host_tar, $remote_plugin)"

      - name: Boot extracted AppImage GUI & exercise Remote Host / QR flow under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          work="$RUNNER_TEMP/appimage-extract"
          app_bin=$(find "$work/squashfs-root" -maxdepth 2 -type f -name 'dsh-community' -perm -111 -print -quit)
          test -n "$app_bin"
          xvfb-run -a -s "-screen 0 1280x800x24" \
            node scripts/linux-appimage-gui-smoke.mjs --executable "$app_bin" --timeout-ms 90000
