name: plugin-catalog-compose

on:
  push:
    branches: [main]
    paths:
      - 'packages/marketplace/catalog.json'
      - 'packages/marketplace/scripts/compose-check.mjs'
      - '.github/workflows/plugin-catalog-compose.yml'
  pull_request:
    paths:
      - 'packages/marketplace/catalog.json'
      - 'packages/marketplace/scripts/compose-check.mjs'
      - '.github/workflows/plugin-catalog-compose.yml'
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install and compose every catalog plugin on the official chain
        run: node packages/marketplace/scripts/compose-check.mjs
