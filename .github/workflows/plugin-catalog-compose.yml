name: plugin-catalog-compose

on:
  push:
    branches: [main]
    paths:
      - 'packages/marketplace/catalog.json'
      - 'packages/marketplace/scripts/compose-check.mjs'
      - '.github/workflows/plugin-catalog-compose.yml'
  pull_request:
    paths:
      - 'packages/marketplace/catalog.json'
      - 'packages/marketplace/scripts/compose-check.mjs'
      - '.github/workflows/plugin-catalog-compose.yml'
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install and compose every catalog plugin on the official chain
        run: node packages/marketplace/scripts/compose-check.mjs
