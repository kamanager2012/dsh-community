name: plugin-catalog-validate

on:
  push:
    branches: [main]
    paths:
      - 'packages/marketplace/catalog.json'
      - 'packages/marketplace/scripts/**'
      - '.github/workflows/plugin-catalog-validate.yml'
  pull_request:
    paths:
      - 'packages/marketplace/catalog.json'
      - 'packages/marketplace/scripts/**'
      - '.github/workflows/plugin-catalog-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Verify catalog against npm and public repos
        run: node packages/marketplace/scripts/verify.mjs
