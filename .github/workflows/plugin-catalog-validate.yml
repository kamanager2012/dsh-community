name: plugin-catalog-validate

on:
  push:
    branches: [main]
    paths:
      - 'packages/marketplace/catalog.json'
      - 'packages/marketplace/scripts/**'
      - '.github/workflows/plugin-catalog-validate.yml'
  pull_request:
    paths:
      - 'packages/marketplace/catalog.json'
      - 'packages/marketplace/scripts/**'
      - '.github/workflows/plugin-catalog-validate.yml'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify catalog against npm and public repos
        run: node packages/marketplace/scripts/verify.mjs
