name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Least privilege by default: builds and artifact uploads never touch
# repository content. Only the publish job elevates (job-level override).
permissions:
  contents: read

jobs:
  release-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Validate immutable candidate release identity
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/validate-release-tag.mjs "$GITHUB_REF_NAME"
      - name: Verify current Published Latest against GitHub
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/validate-published-latest.mjs
      - name: Manual diagnostic build
        if: ${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "workflow_dispatch without a release tag; identity gate intentionally does not classify this as a publishable release"

  runtime-sbom:
    needs: release-identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Generate and validate official-runtime CycloneDX SBOM
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          OUT="$GITHUB_WORKSPACE/release-metadata/dsh-community-${VERSION}-official-runtime.cdx.json"
          node scripts/generate-runtime-sbom.mjs "$OUT"
          echo "SBOM_PATH=$OUT" >> "$GITHUB_ENV"
      - name: Checksum SBOM
        run: node scripts/checksum-release.mjs "$SBOM_PATH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: |
            release-metadata/*-official-runtime.cdx.json
            release-metadata/*-official-runtime.cdx.json.sha256
          if-no-files-found: error

  build-linux:
    needs: release-identity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test
      - name: Package AppImage
        run: pnpm desktop:package -- --appimage
      - name: Asar vendor=0 guard
        run: pnpm vitest run apps/desktop/tests/asar-purity.test.ts
      - name: Checksum
        run: node scripts/checksum-release.mjs apps/desktop/release/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.AppImage.sha256
          if-no-files-found: error

  build-android:
    needs: release-identity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.11.1
        run: |
          GRADLE_VER="8.11.1"
          GRADLE_SHA256="f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
          echo "${GRADLE_SHA256}  /tmp/gradle.zip" | sha256sum -c -
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"
      - name: Verify Android release readiness gate (pure-remote + emulator E2EE verified)
        run: node scripts/verify-android-release-ready.mjs --allow-emulator-verified
      - name: Build and verify signed arm64-v8a Android release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.DSH_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DSH_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DSH_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DSH_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          KEY_DIR="$(mktemp -d)"
          trap 'rm -rf "$KEY_DIR"' EXIT
          KEYSTORE_PATH="$KEY_DIR/dsh-release.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          else
            KEYSTORE_PASSWORD="dsh-ci-ephemeral-keystore-pass"
            KEY_ALIAS="dsh-ci-ephemeral-key"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            keytool -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=DSH CI Diagnostic Release, O=DSH Community, C=US" >/dev/null 2>&1
          fi

          DSH_ANDROID_SIGNING_REQUIRED=true \
          DSH_ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH" \
          DSH_ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
          DSH_ANDROID_KEY_ALIAS="$KEY_ALIAS" \
          DSH_ANDROID_KEY_PASSWORD="$KEY_PASSWORD" \
          gradle --no-daemon -p apps/android -PdshAbiFilters=arm64-v8a :app:assembleRelease

          REL_APK="$(find apps/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$REL_APK"
          if unzip -l "$REL_APK" | grep -Eiq "libnode\.so|nodejs-mobile|nodejs-project|@deepseek-ai/dsh|deepseek-ai|webkit"; then
            echo "ERROR: Forbidden embedded Node/DSH/WebView entries found in release APK" >&2
            exit 1
          fi
          unzip -l "$REL_APK" | grep -q "lib/arm64-v8a/libjingle_peerconnection_so.so"
          if unzip -l "$REL_APK" | grep -q "lib/x86_64/"; then
            echo "ERROR: Expected arm64-v8a-only release APK, found x86_64 native libraries" >&2
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$REL_APK"

          mkdir -p apps/android/release-out
          OUT_APK="apps/android/release-out/dsh-community-${VERSION}-android-arm64-v8a.apk"
          cp "$REL_APK" "$OUT_APK"
          node scripts/checksum-release.mjs "$OUT_APK"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android
          path: |
            apps/android/release-out/*.apk
            apps/android/release-out/*.apk.sha256
          if-no-files-found: error

  sign:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && success() }}
    # Sigstore keyless signing of every release asset (AppImage, APK, SBOM, sha256 sidecars).
    # cosign >= v3 removed --output-signature/--output-certificate; the v3 way is one
    # bundle per blob: <asset>.sigstore.json (signature + Fulcio certificate +
    # Rekor transparency-log proof). See docs/release.md "Artifact signing".
    needs: [build-linux, build-android, runtime-sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for keyless OIDC signing in GitHub Actions
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux
          path: dist-artifacts/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android
          path: dist-artifacts/android
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom
          path: dist-artifacts/sbom
      # sigstore/cosign-installer v3.10.1 (latest v3.x line)
      # cosign v2.6.1: the installer's self-verification downloads
      # cosign-linux-amd64.sig, which the v3.x release line no longer ships
      # (curl 22 / 404 observed on the first tagged run). v2.6.1 still ships
      # detached .sig assets and supports sign-blob/verify-blob --bundle with
      # Fulcio/Rekor keyless verification.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.6.1'
      - name: Sign artifacts (keyless)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist-artifacts/*/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no downloaded artifacts to sign" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            case "$f" in
              *.sig|*.pem|*.sigstore.json) continue ;;
            esac
            echo "signing: $f"
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f" > /dev/null
            test -s "${f}.sigstore.json"
          done
          # upload signatures only; blobs are re-downloaded by publish
          find dist-artifacts -type f ! -name '*.sigstore.json' -delete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed
          path: dist-artifacts
          if-no-files-found: error

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && success() }}
    needs: [build-linux, build-android, runtime-sbom, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Sole writer in this workflow: creates the GitHub Release and uploads assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: linux
          path: dist-artifacts/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android
          path: dist-artifacts/android
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom
          path: dist-artifacts/sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed
          path: dist-signed
      - name: Verify release set structure and SHA256
        run: node scripts/verify-release-set.mjs dist-artifacts dist-signed
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.6.1'
      - name: Verify every release signature against this exact tag
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist-artifacts/*/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no downloaded release assets to verify" >&2
            exit 1
          fi
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}"
          for asset in "${assets[@]}"; do
            rel=${asset#dist-artifacts/}
            bundle="dist-signed/${rel}.sigstore.json"
            echo "verifying signature: ${rel}"
            cosign verify-blob \
              --bundle "${bundle}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "${identity}" \
              "${asset}" >/dev/null
          done
      - name: Prepare notes
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md
          node scripts/release-notes.mjs --title "${GITHUB_REF_NAME}" > release-title.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXTRA=()
          # Only plain semver and -rc.N mirrors may become GitHub Latest.
          # Every other prerelease identifier (alpha, beta, preview, community, etc.)
          # remains a GitHub pre-release and must not displace Published Latest.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            EXTRA+=(--latest)
          else
            EXTRA+=(--prerelease)
          fi
          shopt -s nullglob
          assets=(
            dist-artifacts/*/*.AppImage
            dist-artifacts/*/*.apk
            dist-artifacts/*/*-official-runtime.cdx.json
            dist-artifacts/*/*.sha256
            dist-signed/*/*.sigstore.json
          )
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no artifacts to publish"
            exit 1
          fi
          # Closed loop: a release may not ship unless every published asset has a
          # cosign bundle produced by the sign job. Missing bundle = publish fails.
          for a in "${assets[@]}"; do
            case "$a" in *.sigstore.json) continue ;; esac
            rel=${a#dist-artifacts/}
            if [[ ! -s "dist-signed/$rel.sigstore.json" ]]; then
              echo "missing cosign bundle for $rel; refusing to publish unsigned asset" >&2
              exit 1
            fi
          done
          printf 'publishing %s\n' "${assets[@]}"
          RELEASE_TITLE=$(head -n 1 release-title.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing_names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            missing_assets=()
            for a in "${assets[@]}"; do
              base=$(basename "$a")
              if ! printf '%s\n' "$existing_names" | grep -Fxq "$base"; then
                missing_assets+=("$a")
              fi
            done
            if [[ ${#missing_assets[@]} -eq 0 ]]; then
              echo "release $TAG already contains all release assets; refusing to replace published assets"
              echo "cut a new tag for a new build. do not move a published tag."
              exit 1
            fi
            printf 'uploading missing assets to existing release %s: %s\n' "$TAG" "${missing_assets[*]}"
            gh release upload "$TAG" "${missing_assets[@]}"
            gh release edit "$TAG" \
              --title "${RELEASE_TITLE:-$TAG}" \
              --notes-file release-notes.md \
              "${EXTRA[@]}"
          else
            gh release create "$TAG" \
              --title "${RELEASE_TITLE:-$TAG}" \
              --notes-file release-notes.md \
              "${EXTRA[@]}" \
              "${assets[@]}"
          fi
