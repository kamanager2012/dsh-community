name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Least privilege by default: builds and artifact uploads never touch
# repository content. Only the publish job elevates (job-level override).
permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test
      - name: Package AppImage
        run: pnpm desktop:package -- --appimage
      - name: Asar vendor=0 guard
        run: pnpm vitest run apps/desktop/tests/asar-purity.test.ts
      - name: Checksum
        run: node scripts/checksum-release.mjs apps/desktop/release/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.AppImage.sha256
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Disable Windows Defender realtime
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
      - name: Package NSIS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm desktop:package -- --win
      - name: Asar vendor=0 guard
        run: pnpm vitest run apps/desktop/tests/asar-purity.test.ts
      - name: Checksum
        shell: bash
        run: node scripts/checksum-release.mjs 'apps/desktop/release/*.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.sha256
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Package dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm desktop:package -- --mac
      - name: Asar vendor=0 guard
        run: pnpm vitest run apps/desktop/tests/asar-purity.test.ts
      - name: Checksum
        shell: bash
        run: node scripts/checksum-release.mjs 'apps/desktop/release/*.dmg'
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.sha256
          if-no-files-found: error

  sign:
    # Sigstore keyless signing of every release asset (installers + sha256 sidecars).
    # cosign >= v3 removed --output-signature/--output-certificate; the v3 way is one
    # bundle per blob: <asset>.sigstore.json (signature + Fulcio certificate +
    # Rekor transparency-log proof). OS-level signing (Authenticode / codesign) is
    # out of scope and stays absent — see docs/release.md "Artifact signing".
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for keyless OIDC signing in GitHub Actions
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: false
      # sigstore/cosign-installer v3.10.1 (latest v3.x line)
      # cosign v2.6.1: the installer's self-verification downloads
      # cosign-linux-amd64.sig, which the v3.x release line no longer ships
      # (curl 22 / 404 observed on the first tagged run). v2.6.1 still ships
      # detached .sig assets and supports sign-blob/verify-blob --bundle with
      # Fulcio/Rekor keyless verification.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.6.1'
      - name: Sign artifacts (keyless)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist-artifacts/*/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no downloaded artifacts to sign" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            case "$f" in
              *.sig|*.pem|*.sigstore.json) continue ;;
            esac
            echo "signing: $f"
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f" > /dev/null
            test -s "${f}.sigstore.json"
          done
          # upload signatures only; blobs are re-downloaded by publish
          find dist-artifacts -type f ! -name '*.sigstore.json' -delete
      - uses: actions/upload-artifact@v4
        with:
          name: signed
          path: dist-artifacts
          if-no-files-found: error

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
    needs: [build-linux, build-windows, build-macos, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Sole writer in this workflow: creates the GitHub Release and uploads assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: signed
          path: dist-signed
      - name: Prepare notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXTRA=()
          # 1:1 official-core mirrors (plain or -rc.N) are the current download.
          # Independent community suffixes stay GitHub pre-releases.
          if [[ "$TAG" == *-community.* || "$TAG" == *preview* || "$TAG" == *beta* ]]; then
            EXTRA+=(--prerelease)
          else
            EXTRA+=(--latest)
          fi
          shopt -s nullglob
          assets=(
            dist-artifacts/*/*.AppImage
            dist-artifacts/*/*.exe
            dist-artifacts/*/*.zip
            dist-artifacts/*/*.dmg
            dist-artifacts/*/*.sha256
            dist-signed/*/*.sigstore.json
          )
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no artifacts to publish"
            exit 1
          fi
          # Closed loop: a release may not ship unless every published asset has a
          # cosign bundle produced by the sign job. Missing bundle = publish fails.
          for a in "${assets[@]}"; do
            case "$a" in *.sigstore.json) continue ;; esac
            rel=${a#dist-artifacts/}
            if [[ ! -s "dist-signed/$rel.sigstore.json" ]]; then
              echo "missing cosign bundle for $rel; refusing to publish unsigned asset" >&2
              exit 1
            fi
          done
          printf 'publishing %s\n' "${assets[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to replace published assets"
            echo "cut a new tag for a new build. do not move a published tag."
            exit 1
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${EXTRA[@]}" \
            "${assets[@]}"
