name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Least privilege by default: builds and artifact uploads never touch
# repository content. Only the publish job elevates (job-level override).
permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test
      - name: Package AppImage
        run: pnpm desktop:package -- --appimage
      - name: Asar vendor=0 guard
        run: pnpm vitest run apps/desktop/tests/asar-purity.test.ts
      - name: Checksum
        run: node scripts/checksum-release.mjs apps/desktop/release/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.AppImage.sha256
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Disable Windows Defender realtime
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
      - name: Package NSIS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm desktop:package -- --win
      - name: Checksum
        shell: bash
        run: node scripts/checksum-release.mjs 'apps/desktop/release/*.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.sha256
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Package dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm desktop:package -- --mac
      - name: Checksum
        shell: bash
        run: node scripts/checksum-release.mjs 'apps/desktop/release/*.dmg'
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.sha256
          if-no-files-found: error

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Sole writer in this workflow: creates the GitHub Release and uploads assets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: false
      - name: Prepare notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXTRA=()
          # 1:1 official-core mirrors (plain or -rc.N) are the current download.
          # Independent community suffixes stay GitHub pre-releases.
          if [[ "$TAG" == *-community.* || "$TAG" == *preview* || "$TAG" == *beta* ]]; then
            EXTRA+=(--prerelease)
          else
            EXTRA+=(--latest)
          fi
          shopt -s nullglob
          assets=(
            dist-artifacts/*/*.AppImage
            dist-artifacts/*/*.exe
            dist-artifacts/*/*.zip
            dist-artifacts/*/*.dmg
            dist-artifacts/*/*.sha256
          )
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "no artifacts to publish"
            exit 1
          fi
          printf 'publishing %s\n' "${assets[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to replace published assets"
            echo "cut a new tag for a new build. do not move a published tag."
            exit 1
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${EXTRA[@]}" \
            "${assets[@]}"
