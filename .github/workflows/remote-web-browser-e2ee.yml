name: remote-web-browser-e2ee

on:
  pull_request:
    paths:
      - 'apps/remote-web/**'
      - 'packages/remote-adapter/**'
      - 'scripts/e2e/remote-web-browser-e2ee.mjs'
      - '.github/workflows/remote-web-browser-e2ee.yml'
  push:
    branches: [main, master]
    paths:
      - 'apps/remote-web/**'
      - 'packages/remote-adapter/**'
      - 'scripts/e2e/remote-web-browser-e2ee.mjs'
      - '.github/workflows/remote-web-browser-e2ee.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-e2ee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build remote-adapter and remote-web PWA
        run: pnpm --filter @dsh-community/shared-types --filter @dsh-community/dsh-bridge --filter @dsh-community/remote-adapter --filter @dsh-community/remote-web build
      - name: Ensure Chromium executable is available
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            npx --yes playwright install chromium
          fi
      - name: Run real headless Chromium Noise IK E2EE + approval + Git diff E2E
        run: node scripts/e2e/remote-web-browser-e2ee.mjs
