name: runtime-lock-adopt

on:
  pull_request:
    paths:
      - '.github/workflows/runtime-lock-adopt.yml'

permissions:
  actions: read
  contents: write

jobs:
  adopt:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      SOURCE_RUN: '33466316081'
    steps:
      - name: Download reviewed generated lock artifact
        run: |
          set -euo pipefail
          mkdir -p lock-artifact
          gh run download "$SOURCE_RUN"             --repo "$GITHUB_REPOSITORY"             --name official-runtime-package-lock             --dir lock-artifact
          test -s lock-artifact/package-lock.json

      - name: Validate reviewed lock identity
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const crypto = require('crypto')
          const path = 'lock-artifact/package-lock.json'
          const raw = fs.readFileSync(path)
          const lock = JSON.parse(raw)
          if (lock.lockfileVersion !== 3) throw new Error('expected lockfileVersion 3')
          if (lock.packages?.['']?.dependencies?.['@deepseek-ai/dsh'] !== '0.1.1-rc.2') {
            throw new Error('root official DSH dependency mismatch')
          }
          const dsh = lock.packages?.['node_modules/@deepseek-ai/dsh']
          if (!dsh || dsh.version !== '0.1.1-rc.2') throw new Error('locked official DSH mismatch')
          const digest = crypto.createHash('sha256').update(raw).digest('hex')
          if (digest !== 'bf71de76abdd715d43007fb14c527aebbc7098c7c521baadbf1fa31547bd773c') {
            throw new Error('generated lock digest mismatch: ' + digest)
          }
          console.log('reviewed runtime lock OK:', digest)
          NODE

      - name: Commit exact reviewed lock to PR branch
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const content = fs.readFileSync('lock-artifact/package-lock.json').toString('base64')
          fs.writeFileSync('lock-put.json', JSON.stringify({
            message: 'build(runtime): commit reviewed official runtime lock',
            content,
            branch: process.env.HEAD_REF,
          }))
          NODE
          gh api \
            --method PUT \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/contents/apps/desktop/runtime-lock/package-lock.json" \
            --input lock-put.json \
            --jq '.commit.sha'
