name: runtime-lock-generate

on:
  pull_request:
    paths:
      - 'apps/desktop/runtime-lock/package.json'
      - '.github/workflows/runtime-lock-generate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Generate npm lock from exact runtime manifest
        working-directory: apps/desktop/runtime-lock
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const l=require('./package-lock.json'); if(l.lockfileVersion!==3) throw new Error('expected lockfileVersion 3')"
          node -e "const l=require('./package-lock.json'); const p=l.packages?.['node_modules/@deepseek-ai/dsh']; if(!p || p.version!=='0.1.1-rc.2') throw new Error('official DSH lock mismatch')"

      - name: Upload generated lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: official-runtime-package-lock
          path: apps/desktop/runtime-lock/package-lock.json
          if-no-files-found: error
          retention-days: 1
