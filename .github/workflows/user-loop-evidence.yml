name: user-loop-evidence

# Manual, billable, exact-release evidence. This workflow is intentionally NOT
# scheduled and is not part of normal push/PR CI.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag to verify (empty = GitHub Latest)'
        required: false
        default: ''
      timeout_seconds:
        description: 'per-turn timeout'
        required: false
        default: '180'

permissions:
  contents: read

concurrency:
  group: user-loop-evidence
  cancel-in-progress: false

jobs:
  linux-terminal:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          else
            TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --jq .tag_name >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Exact release under test: $TAG"

      - name: Require explicit real-model credential
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Repository secret DEEPSEEK_API_KEY is required. This workflow never falls back to a mock."
            exit 2
          fi

      - name: Checkout evidence runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout exact release under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag }}
          path: release-src

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: release-src/pnpm-lock.yaml

      - name: Install exact tag
        working-directory: release-src
        run: pnpm install --frozen-lockfile

      - name: Build exact-tag Terminal endpoint
        working-directory: release-src
        run: pnpm build:tui

      - name: Confirm release/runtime identity
        id: identity
        run: |
          set -euo pipefail
          commit=$(git -C release-src rev-parse HEAD)
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::exact-release checkout did not resolve to a full commit SHA"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          node release-src/apps/tui/dist/bin.js version | tee runtime-version.txt
          grep -q '@deepseek-ai/dsh' runtime-version.txt
          echo "release commit: $commit"

      - name: Download and extract published Linux AppImage runtime archive
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          work="${RUNNER_TEMP}/user-loop-appimage"
          rm -rf "$work"
          mkdir -p "$work"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/dsh-community-${VER}.AppImage"
          curl -fSL --retry 3 -o "$work/app.AppImage" "$URL"
          curl -fSL --retry 3 -o "$work/app.AppImage.sha256" "${URL}.sha256"
          expected=$(cut -d' ' -f1 "$work/app.AppImage.sha256" | tr '[:upper:]' '[:lower:]')
          actual=$(sha256sum "$work/app.AppImage" | cut -d' ' -f1)
          [ "$expected" = "$actual" ] || { echo "sha256 mismatch: $actual vs $expected"; exit 1; }
          chmod +x "$work/app.AppImage"
          (cd "$work" && ./app.AppImage --appimage-extract >/dev/null)
          test -s "$work/squashfs-root/resources/host/official-dsh.tar"
          echo "appimage runtime archive extracted: $work/squashfs-root/resources/host/official-dsh.tar"

      - name: Run real new -> answer -> resume -> answer loop
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_HOME: ${{ runner.temp }}/user-loop-dsh-home
          EVIDENCE_TAG: ${{ steps.release.outputs.tag }}
          EVIDENCE_COMMIT: ${{ steps.identity.outputs.commit }}
          APPIMAGE_ARCHIVE: ${{ runner.temp }}/user-loop-appimage/squashfs-root/resources/host/official-dsh.tar
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/scripts/e2e/user-loop.py" \
            --launcher release-src/apps/tui/dist/bin.js \
            --appimage-archive "$APPIMAGE_ARCHIVE" \
            --tag "$EVIDENCE_TAG" \
            --commit "$EVIDENCE_COMMIT" \
            --timeout-seconds "${{ github.event.inputs.timeout_seconds }}" \
            --evidence-out user-loop-evidence.json

      - name: Publish sanitized evidence summary
        if: always()
        run: |
          {
            echo "## Real user-loop evidence"
            echo
            echo "- Release: ${{ steps.release.outputs.tag }}"
            echo "- Commit: ${{ steps.identity.outputs.commit }}"
            echo "- Endpoint: WSL/Linux Terminal"
            if [ -f user-loop-evidence.json ]; then
              echo "- Result: **PASS**"
              echo
              echo '~~~json'
              cat user-loop-evidence.json
              echo '~~~'
            else
              echo "- Result: **NO PASS EVIDENCE PRODUCED**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && hashFiles('user-loop-evidence.json') != ''
        with:
          name: user-loop-evidence-${{ steps.release.outputs.tag }}
          path: user-loop-evidence.json
          if-no-files-found: error
          retention-days: 90
