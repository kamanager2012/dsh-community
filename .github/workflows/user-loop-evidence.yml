name: user-loop-evidence

# Manual, billable, exact-release evidence. This workflow is intentionally NOT
# scheduled and is not part of normal push/PR CI.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag to verify (empty = GitHub Latest)'
        required: false
        default: ''
      timeout_seconds:
        description: 'per-turn timeout'
        required: false
        default: '180'

permissions:
  contents: read

concurrency:
  group: user-loop-evidence
  cancel-in-progress: false

jobs:
  linux-terminal:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          else
            TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --jq .tag_name >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Exact release under test: $TAG"

      - name: Require explicit real-model credential
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::Repository secret DEEPSEEK_API_KEY is required. This workflow never falls back to a mock."
            exit 2
          fi

      - name: Checkout evidence runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout exact release under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ steps.release.outputs.tag }}
          path: release-src

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: release-src/pnpm-lock.yaml

      - name: Install exact tag
        working-directory: release-src
        run: pnpm install --frozen-lockfile

      - name: Build exact-tag Terminal endpoint
        working-directory: release-src
        run: pnpm build:tui

      - name: Confirm release/runtime identity
        id: identity
        run: |
          set -euo pipefail
          commit=$(git -C release-src rev-parse HEAD)
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}
      - name: Run real new -> answer -> resume -> answer loop
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_HOME: ${{ runner.temp }}/user-loop-dsh-home
          EVIDENCE_TAG: ${{ steps.release.outputs.tag }}
          EVIDENCE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/scripts/e2e/user-loop.py" \
            --launcher release-src/apps/tui/dist/bin.js \
            --tag "$EVIDENCE_TAG" \
            --commit "$EVIDENCE_COMMIT" \
            --timeout-seconds "${{ github.event.inputs.timeout_seconds }}" \
            --evidence-out user-loop-evidence.json

      - name: Publish sanitized evidence summary
        if: always()
        run: |
          {
            echo "## Real user-loop evidence"
            echo
            echo "- Release: ${{ steps.release.outputs.tag }}"
            echo "- Commit: \`${{ steps.identity.outputs.commit }}\`"
            echo "- Endpoint: WSL/Linux Terminal"
            if [ -f user-loop-evidence.json ]; then
              echo "- Result: **PASS**"
              echo
              echo '~~~json'
              cat user-loop-evidence.json
              echo '~~~'
            else
              echo "- Result: **NO PASS EVIDENCE PRODUCED**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && hashFiles('user-loop-evidence.json') != ''
        with:
          name: user-loop-evidence-${{ steps.release.outputs.tag }}
          path: user-loop-evidence.json
          if-no-files-found: error
          retention-days: 90
; then
            echo "::error::exact-release checkout did not resolve to a full commit SHA"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          node release-src/apps/tui/dist/bin.js version | tee runtime-version.txt
          grep -q '@deepseek-ai/dsh' runtime-version.txt
          echo "release commit: $commit"

      - name: Run real new -> answer -> resume -> answer loop
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_HOME: ${{ runner.temp }}/user-loop-dsh-home
          EVIDENCE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/scripts/e2e/user-loop.py" \
            --launcher release-src/apps/tui/dist/bin.js \
            --tag "$EVIDENCE_TAG" \
            --timeout-seconds "${{ github.event.inputs.timeout_seconds }}" \
            --evidence-out user-loop-evidence.json

      - name: Publish sanitized evidence summary
        if: always()
        run: |
          {
            echo "## Real user-loop evidence"
            echo
            echo "- Release: ${{ steps.release.outputs.tag }}"
            echo "- Endpoint: WSL/Linux Terminal"
            if [ -f user-loop-evidence.json ]; then
              echo "- Result: **PASS**"
              echo
              echo '~~~json'
              cat user-loop-evidence.json
              echo '~~~'
            else
              echo "- Result: **NO PASS EVIDENCE PRODUCED**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && hashFiles('user-loop-evidence.json') != ''
        with:
          name: user-loop-evidence-${{ steps.release.outputs.tag }}
          path: user-loop-evidence.json
          if-no-files-found: error
          retention-days: 90
