name: windows-package-smoke

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/windows-package-smoke.yml'
      - 'apps/desktop/**'
      - 'packages/dsh-bridge/**'
      - 'packages/shared-types/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Package NSIS with host protection unchanged
        run: pnpm desktop:package -- --win

      - name: Asar vendor=0 guard
        run: pnpm vitest run apps/desktop/tests/asar-purity.test.ts

      - name: Checksum packaged installer
        shell: bash
        run: node scripts/checksum-release.mjs 'apps/desktop/release/*.exe'

      - name: Verify installer and checksum sidecar exist
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path apps/desktop/release -Filter '*.exe')
          if ($files.Count -lt 1) {
            throw 'No Windows installer was produced.'
          }
          foreach ($file in $files) {
            $sidecar = "$($file.FullName).sha256"
            if (-not (Test-Path $sidecar)) {
              throw "Missing checksum sidecar for $($file.Name)"
            }
            if ((Get-Item $sidecar).Length -le 0) {
              throw "Empty checksum sidecar for $($file.Name)"
            }
          }
