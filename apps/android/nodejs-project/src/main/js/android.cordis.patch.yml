# Android provider overlay over the official Web composition.
# Keep official tool/session/agent ownership. Replace only execution-world
# providers whose built-in local implementations have no Android substrate.

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
  disabled: true

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  disabled: true

- insert:
    - id: android-subprocess
      name: ./android-subprocess-provider.mjs
    - id: android-sandbox
      name: ./android-sandbox-provider.mjs
