name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VERSION == package.json
        run: |
          v_file=$(cat VERSION)
          v_pkg=$(node -p "require('./package.json').version")
          echo "VERSION=$v_file  package.json=$v_pkg"
          test "$v_file" = "$v_pkg"

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Run test suite
        run: |
          cd tests
          python3 -m pytest . -q

  benchmark-level1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Level 1 (pattern) — no new non-baseline failures
        run: |
          cd benchmarks
          python3 runner.py --json > /tmp/l1.json
          python3 << 'EOF'
          import json, sys
          d = json.load(open('/tmp/l1.json'))
          # Known-baseline failure IDs (honest gaps, documented in README).
          # cap-001/002 moved to Level 4 (capability-aware) in v1.7.0.
          baseline = {
              "bypass-007", "bypass-016", "bypass-017", "bypass-020",  # 4 known bypasses
              "fp-001", "fp-002",                                        # 2 pattern-layer FPs
          }
          fails = {r["id"] for r in d["results"] if not r["pass"]}
          new = fails - baseline
          s = d["summary"]
          print(f"Level 1: {s['passed']}/{s['total']} passed, failures={sorted(fails)}")
          if new:
              print(f"FAIL: NEW non-baseline failures: {sorted(new)}")
              sys.exit(1)
          print("Level 1 baseline OK")
          EOF

  benchmark-level2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Level 2 (asset-aware) — must be 6/6
        run: |
          cd benchmarks/level2
          python3 runner.py --json > /tmp/l2.json
          python3 << 'EOF'
          import json, sys
          d = json.load(open('/tmp/l2.json'))
          print(f"Level 2: {d['passed']}/{d['total']}")
          if not (d["passed"] == 6 and d["total"] == 6):
              print("FAIL: Level 2 must be 6/6")
              sys.exit(1)
          print("Level 2 OK")
          EOF

  benchmark-level3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Level 3 (trajectory) — must be 7/7
        run: |
          cd benchmarks/level3
          python3 runner.py --json > /tmp/l3.json
          python3 << 'EOF'
          import json, sys
          d = json.load(open('/tmp/l3.json'))
          print(f"Level 3: {d['passed']}/{d['total']}")
          if not (d["passed"] == 7 and d["total"] == 7):
              print("FAIL: Level 3 must be 7/7")
              sys.exit(1)
          print("Level 3 OK")
          EOF

  benchmark-level4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Level 4 (capability preservation) — must be 5/5
        run: |
          cd benchmarks/level4
          python3 runner.py --json > /tmp/l4.json
          python3 << 'EOF'
          import json, sys
          d = json.load(open('/tmp/l4.json'))
          print(f"Level 4: {d['passed']}/{d['total']}")
          if not (d["passed"] == 5 and d["total"] == 5):
              print("FAIL: Level 4 must be 5/5")
              sys.exit(1)
          print("Level 4 OK")
          EOF

  install-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deploy.sh --dry-run
        run: bash deploy.sh --dry-run
