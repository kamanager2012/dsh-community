name: Dependency security audit

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install committed dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Reject moderate-or-higher known vulnerabilities
        run: npm audit --audit-level=moderate
