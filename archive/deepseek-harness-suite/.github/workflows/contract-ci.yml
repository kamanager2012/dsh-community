name: Contract CI & Upstream Compatibility

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run daily at 02:00 UTC to check for upstream breaking changes
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages & apps
        run: pnpm run build

      - name: Run unit & contract tests
        run: pnpm run test

      - name: Check upstream contract compatibility
        run: npx tsx scripts/contract-checker.ts
