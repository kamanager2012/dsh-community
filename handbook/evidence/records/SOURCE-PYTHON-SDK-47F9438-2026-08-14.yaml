result:
  summary: >-
    The source package requires Python >=3.10 and depends on the matching
    deepseek-harness-runtime-bin development package. DeepSeekHarness keeps a
    runtime subprocess across run calls and is intended to be closed through a
    context manager or close(). The public RunResult contains session_id,
    final_response, finish_reason, events, notifications and session_root;
    source documentation defines events as root-session events and
    notifications as root plus known descendant notifications. finish_reason
    is derived from the last turn/end reason kind and malformed protocol data
    raises SdkProtocolError.
