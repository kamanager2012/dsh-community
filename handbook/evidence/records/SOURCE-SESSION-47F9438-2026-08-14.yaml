result:
  summary: >-
    The source documentation describes an append-only SessionEvent log as the
    source of truth and derives message history from it. The Host session API
    distinguishes history reads from agent resume: history inspection does not
    resume or publish an Agent. Its fork operation cuts at a completed-turn
    boundary, creates a new session, and records parent lineage and inherited
    metadata. The CLI reference describes headless as a fresh persistent Agent
    per one-shot invocation, while the Python SDK exposes session_id on its
    run boundary. These are entrypoint-specific contracts and require separate
    F2 tests before being presented as end-user guarantees for the published
    package.
  exit_code: 0
