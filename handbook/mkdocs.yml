site_name: DeepSeek Harness 中文使用手册
site_description: DeepSeek Harness 的工程实施、验收与运维手册
site_url: https://kamanager2012.github.io/deepseek-harness-handbook/
repo_name: kamanager2012/deepseek-harness-handbook
repo_url: https://github.com/kamanager2012/deepseek-harness-handbook
edit_uri: edit/main/
docs_dir: .mkdocs-docs
site_dir: .mkdocs-site

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

