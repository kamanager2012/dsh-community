# Community overlay on official rows only. No third-party TUI plugin.
- id: system-prompt
  config:
    persona: !!js process.env.DSH_TUI_PERSONA ?? 'You are a coding agent.'

- id: agent-loop
  config:
    agents: []

# Sandbox/approval defaults are platform-uniform and safe. Operators may widen
# them explicitly via DSH_PERMISSION_MODE / DSH_APPROVAL_POLICY; nothing is
# widened silently by OS detection.
- id: sandbox-policy
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'workspace-write'"
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: !!js "process.env.DSH_APPROVAL_POLICY ?? (process.env.DSH_PERMISSION_MODE === 'danger-full-access' ? 'never' : 'ask')"

- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_TUI_SESSION_ROOT ?? dshHomePath('sessions')
