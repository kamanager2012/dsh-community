# dsh-community-tui-surface bundle patch: the community-owned terminal surface
# over the dsh-base layer. One insert (our plugin) plus the official rows an
# interactive terminal needs:
#   - code-runtime: the official agent execution runtime (headless ships the
#     same row; a surface without it can compose but never executes a turn)
#   - user-questions / approval: official interaction services
#
# Everything else stays official. No third-party harness products are mounted.

- id: hmr
  disabled: true

- insert:
    - id: dsh-community-tui
      name: '@dsh-community/tui-surface'

- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask
